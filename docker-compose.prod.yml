version: "3.8"
services:
  web:
    command: npm start
    environment:
      NODE_ENV: production
    build:
      dockerfile: Dockerfile
  db:
    image: postgres
    restart: always
    ports:
      - "5914:5432"
      - "9229:9229" # debugger port
    volumes:
      - herofit-postgres:/var/lib/postgresql/data
