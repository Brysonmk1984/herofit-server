# THIS IS THE DEV docker-compose FILE. It INHERITS FROM docker-compose.yml.
# CALLING THE ALIAS dchf, which can be found in aliases.zsh yields this command:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up

version: "3.8"
services:
  web:
    volumes:
      # mount app code from outside to the container for dev reloadin
      - .:/usr/src/app # same as WORKDIR in your Dockerfile
    command: npm run dev
    environment:
      NODE_ENV: development
    build:
      dockerfile: Dockerfile.dev
  db:
    image: postgres
    environment:
      PGUSER: postgres
    ports:
      - "5914:5432"
    volumes:
      - herofit-postgres:/var/lib/postgresql/data
